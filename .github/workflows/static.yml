# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate iPhone and Android PNG app icons
        run: |
          python3 -m pip install --quiet --user Pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("radio-neon-logo.webp").convert("RGB")
          for size in (180, 192, 512):
              output = source.resize((size, size), Image.Resampling.LANCZOS)
              output.save(Path(f"radio-icon-{size}.png"), "PNG", optimize=True)
          # Safari also probes these conventional root filenames.
          for name in ("apple-touch-icon.png", "apple-touch-icon-precomposed.png", "radio-ava-app-icon-2026.png"):
              source.resize((180, 180), Image.Resampling.LANCZOS).save(name, "PNG", optimize=True)
          # Diagnostic only: test RGBA PNG (IHDR color type 6) against RGB (type 2).
          source.convert("RGBA").resize((180, 180), Image.Resampling.LANCZOS).save(
              "radio-icon-rgba-test-180.png", "PNG", optimize=True
          )
          # Verify generated artifacts before publishing them.
          for name in ("radio-icon-180.png", "radio-icon-192.png", "radio-icon-512.png", "apple-touch-icon.png", "radio-ava-app-icon-2026.png", "radio-icon-rgba-test-180.png"):
              with Image.open(name) as icon:
                  icon.verify()
          with Image.open("radio-icon-rgba-test-180.png") as diagnostic:
              assert diagnostic.mode == "RGBA" and diagnostic.size == (180, 180)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Wait for Pages artifact indexing
        run: sleep 12
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
