name: Listener club browser QA
on:
  pull_request:
    paths:
      - 'v2/**'
      - 'backend/access-pilot.js'
      - 'backend/platform-worker.js'
      - 'backend/migrations/**'
      - 'backend/tests/access-fixture.mjs'
      - '.github/workflows/listener-hub-browser.yml'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tooling
        run: |
          npm install --ignore-scripts --no-save --no-audit --no-fund playwright@1.56.1
          ./node_modules/.bin/playwright install chromium
      - name: Test RTL UI at phone/tablet/desktop and mocked request flow
        run: node v2/tests/listener-hub-browser.mjs
      - name: Test offline invite-only Access flow
        run: node v2/tests/access-pilot-browser.mjs
      - name: Upload QA screenshots for manual visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listener-hub-screenshots
          path: |
            .qa-listener-390.png
            .qa-listener-1440.png
            .qa-radio-club-390.png
            .qa-radio-club-1440.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
