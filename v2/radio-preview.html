<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151514">
  <meta name="robots" content="noindex">
  <title>آوا و نوا | نمونهٔ رادیو</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="radio-preview.css">
  <script src="media-commands.js?v=3" defer></script>
  <script src="radio-preview.js?v=3" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-radio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="2"/><path d="M7.5 7.5a6.4 6.4 0 0 0 0 9m9-9a6.4 6.4 0 0 1 0 9M4.4 4.4a10.8 10.8 0 0 0 0 15.2M19.6 4.4a10.8 10.8 0 0 1 0 15.2"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.8"/><path d="m15 15 5 5"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v12h14V8m-10 4h6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M7 4a1 1 0 0 1 1.5-.86l13 8a1 1 0 0 1 0 1.72l-13 8A1 1 0 0 1 7 20z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M6 4h4v16H6zm8 0h4v16h-4z"/></symbol>
  </svg>
  <div class="shell">
    <header><span class="mark"><svg><use href="#i-radio"/></svg></span><b>آوا و نوا</b></header>
    <main>
      <section id="home">
        <div class="hero">
          <div><span class="live"><i></i> رادیو زنده</span><h1>آوا و نوا<br><small>با آرش</small></h1>
          <button class="listen" id="liveButton"><svg><use href="#i-play"/></svg><span>شنیدن رادیو</span></button></div>
        </div>
        <div class="heading"><h2>آخرین برنامه‌ها</h2><a href="#archive">همه ‹</a></div>
        <div id="recent"></div>
        <details><summary>دربارهٔ برنامه</summary><p>موسیقی زنده، شعر و آواز با آرش در رادیو آوا و نوا.</p></details>
      </section>
      <section id="archive" hidden>
        <h1>آرشیو رادیو</h1>
        <label class="search"><svg><use href="#i-search"/></svg><input type="search" id="archiveQuery" placeholder="جست‌وجوی برنامه یا تاریخ" aria-label="جست‌وجوی آرشیو"></label>
        <div id="groups"></div>
      </section>
    </main>
    <footer><div class="mini">
      <img id="cover" src="gallery/player-tar.jpg" alt="">
      <div class="mini-copy"><strong id="now">رادیو آوا و نوا</strong><small id="state" aria-live="polite">پخش زنده</small></div>
      <button id="toggle" aria-label="پخش"><svg><use href="#i-play"/></svg></button>
    </div>
    <nav aria-label="بخش‌های رادیو"><a href="#home" aria-current="page"><svg><use href="#i-home"/></svg>خانه</a><a href="./music-library/?view=search"><svg><use href="#i-search"/></svg>کشف موسیقی</a><a href="#archive"><svg><use href="#i-archive"/></svg>آرشیو</a></nav></footer>
  </div>
  <audio id="audio" preload="none"></audio>
</body>
</html>
