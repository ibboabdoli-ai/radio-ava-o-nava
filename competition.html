<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b1035"><title>ثبت‌نام مسابقه | رادیو آوا و نوا</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#381654,#0e0b24 68%);color:#fff1dd;font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.8}main{max-width:610px;margin:0 auto;padding:26px 16px 65px}.top{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;margin-bottom:25px}.top img{width:56px;height:56px;border-radius:50%;border:1px solid #d4a0ff}.card{background:linear-gradient(140deg,#301544e8,#110e2de8);border:1px solid #bd78de;border-radius:26px;padding:clamp(20px,5vw,36px);box-shadow:0 10px 45px #05020a88}h1{margin:0;color:#ffdb9f;font-size:clamp(24px,5vw,34px)}p{margin:6px 0 22px;color:#dfcfe7}.field{margin:17px 0}label{display:block;font-size:15px;font-weight:700;margin-bottom:7px}input,select{width:100%;padding:13px 14px;border:1px solid #85659b;background:#1b1638;color:white;border-radius:12px;font:inherit}input:focus,select:focus{outline:2px solid #e0aaff}input::placeholder{color:#aaa0bb}button{display:block;width:100%;margin-top:21px;border:1px solid #ffc981;border-radius:15px;background:linear-gradient(110deg,#7636a5,#492069);color:#fff4dd;font:700 16px Tahoma;padding:14px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.help{font-size:13px;color:#cfc0db}.notice{margin-top:18px;padding:12px;border:1px solid #ba91ca;border-radius:12px;background:#281b40;color:#f7e6ff}a{color:#ffd496}.hidden{display:none}footer{text-align:center;margin-top:22px;font-size:13px;color:#bda9ce}</style></head>
<body><main><a class="top" href="./"><img src="./radio-neon-logo.webp" alt=""><strong>رادیو آوا و نوا</strong></a>
<section class="card"><h1>ثبت‌نام مسابقه</h1><p>برای شرکت در مسابقه آوا و نوا مشخصات خود را وارد کنید.</p>
<form id="registration" novalidate>
<div class="field"><label for="person">نام شرکت‌کننده *</label><input id="person" name="name" required minlength="2" maxlength="70" autocomplete="name" placeholder="نام شما"></div>
<div class="field"><label for="clubhouse">نام کاربری کلاب‌هاوس *</label><input id="clubhouse" name="clubhouse" required minlength="2" maxlength="60" placeholder="@username" dir="ltr" autocomplete="off"></div>
<div class="field"><label for="category">رشته مسابقه *</label><select id="category" name="category" required><option value="">انتخاب کنید</option><option>شعرخوانی</option><option>آواز</option><option>دکلمه</option><option>سایر</option></select></div>
<div class="field"><label><input type="checkbox" name="consent" required style="width:auto;margin-left:8px">با ثبت اطلاعات برای مدیریت مسابقه موافقم.</label></div>
<div class="field hidden" aria-hidden="true"><label for="website">وب‌سایت</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
<button type="submit" id="submit" disabled>ثبت‌نام</button>
<div class="notice" id="notice" role="status">ثبت‌نام هنوز فعال نشده است. اتصال امن به فرم ذخیره‌سازی باید توسط مدیر تکمیل شود.</div>
</form>
<p class="help">فقط نام، نام کاربری و رشته مسابقه دریافت می‌شود. اطلاعات شرکت‌کنندگان نباید در مخزن عمومی سایت ذخیره شود.</p></section>
<footer><a href="./">بازگشت به رادیو</a></footer>
<script src="./competition-config.js"></script><script>
(()=>{const form=document.getElementById('registration'),button=document.getElementById('submit'),notice=document.getElementById('notice');const url=window.RADIO_COMPETITION_FORM_URL||'';if(!/^https:\/\/docs\.google\.com\/forms\//.test(url)){return;}button.disabled=false;notice.textContent='پس از تکمیل فرم، به صفحه رسمی ثبت‌نام منتقل می‌شوید. اطلاعات توسط گوگل فرم در فایل خصوصی مدیر ثبت می‌شود.';form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;if(form.elements.website.value)return;const params=new URLSearchParams({name:form.elements.name.value.trim(),clubhouse:form.elements.clubhouse.value.trim(),category:form.elements.category.value});sessionStorage.setItem('radioCompetitionDraft',params.toString());window.location.assign(url);});})();
</script></main></body></html>
