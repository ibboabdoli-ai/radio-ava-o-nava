<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151514">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>حساب من | رادیو آوا و نوا</title>
<link rel="icon" href="../../radio-neon-logo.webp">
<link rel="stylesheet" href="./club-archive.css?v=7">
<link rel="stylesheet" href="./account.css?v=5">
<script src="./account.js?v=4" type="module"></script>
</head>
<body>
<header class="page-head">
  <a class="station" href="https://radio.ibboabdoli.com/v2/">آوا و نوا</a>
  <nav class="account-nav" aria-label="مسیرهای رادیو">
    <a href="https://radio.ibboabdoli.com/v2/music-library/">آرشیو آهنگ‌ها</a>
    <a href="/v2/radio-club">باشگاه شنوندگان</a>
  </nav>
</header>
<main>
  <h1 id="heading">حساب من</h1>
  <p class="state" id="state" role="status" aria-live="polite">در حال بارگذاری…</p>

  <section class="account-panel picker-track" id="picker" hidden>
    <p id="picker-track"></p>
    <button id="close-picker" type="button">بازگشت به پخش</button>
  </section>

  <section class="account-panel" id="sign-in" hidden>
    <h2>ورود یا ساخت حساب</h2>
    <a class="button primary" id="google" href="/api/library/auth/google" hidden>ورود با گوگل</a>
    <form id="club-sign-in" autocomplete="off">
      <label for="club-code">کد عضویت باشگاه</label>
      <div class="action-row">
        <input id="club-code" name="code" dir="ltr" maxlength="24" required autocomplete="one-time-code" autocapitalize="none" spellcheck="false">
        <button type="submit">ورود از باشگاه</button>
      </div>
    </form>
    <details>
      <summary>ورود با نام کاربری و گذرواژه</summary>
      <form id="password-sign-in">
        <label for="username">نام کاربری باشگاه</label>
        <input id="username" name="username" dir="ltr" maxlength="40" autocomplete="username" required>
        <label for="password">گذرواژه</label>
        <input id="password" name="password" type="password" dir="ltr" maxlength="128" autocomplete="current-password" required>
        <button type="submit">ورود با گذرواژه</button>
      </form>
      <a href="/v2/radio-club#recover-form">بازیابی حساب باشگاه</a>
    </details>
    <a href="https://www.clubhouse.com/@ibboabdoli">اگر کد نداری، به «آوا و نوا» پیام «عضویت» بده.</a>
  </section>

  <section class="account-panel profile" id="profile" hidden>
    <img id="avatar" alt="" width="56" height="56" hidden>
    <div><h2 id="display-name"></h2><span id="profile-handle" hidden dir="ltr"></span><small id="signin-method"></small></div>
    <button id="logout" type="button">خروج</button>
  </section>

  <section id="my-playlists" hidden>
    <h2 id="list-title">پلی‌لیست‌های من</h2>
    <form id="create" class="account-panel">
      <label for="playlist-name">نام پلی‌لیست جدید</label>
      <div class="action-row">
        <input id="playlist-name" name="name" maxlength="80" placeholder="مثلاً آهنگ‌های شب" autocomplete="off" required>
        <button class="primary" id="create-submit" type="submit">ساخت پلی‌لیست</button>
      </div>
    </form>
    <ul class="list" id="playlists"></ul>
    <details id="new-playlist" hidden>
      <summary>پلی‌لیست جدید</summary>
    </details>
  </section>

  <section id="playlist" hidden>
    <a id="playlist-back" href="./account.html">همهٔ پلی‌لیست‌های من ←</a>
    <h2 id="playlist-title"></h2>
    <p class="state" id="visibility"></p>
    <form class="account-panel" id="edit" hidden>
      <label for="edit-name">نام پلی‌لیست</label>
      <input id="edit-name" name="name" maxlength="80" required>
      <label class="check"><input type="checkbox" name="public"> عمومی و قابل اشتراک با لینک</label>
      <div class="action-row">
        <button class="primary" type="submit">ذخیره</button>
        <button id="share" type="button" hidden>کپی لینک</button>
        <button id="delete" type="button">حذف پلی‌لیست</button>
      </div>
      <label id="share-url-label" for="share-url" hidden>لینک اشتراک‌گذاری</label>
      <input id="share-url" type="url" readonly dir="ltr" hidden>
    </form>
    <div class="account-panel" id="player" hidden>
      <div class="action-row"><button id="play-all" class="primary" type="button">پخش فهرست</button><strong id="current"></strong></div>
      <audio controls preload="none" id="audio" aria-label="پخش آهنگ"></audio>
      <a class="button" id="save-playing-track" href="./account.html" target="_blank" rel="noopener" hidden>افزودن به پلی‌لیست</a>
    </div>
    <ol id="tracks" class="list"></ol>
  </section>
</main>
</body>
</html>
